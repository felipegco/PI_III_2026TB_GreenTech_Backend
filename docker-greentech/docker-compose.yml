services:
  atualizar-repos:
    image: alpine/git
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        git config --global --add safe.directory '*'
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        echo "→ Backend:"  && (git -C /backend  pull --ff-only || echo "⚠ backend não atualizado")
        echo "→ Frontend:" && (git -C /frontend pull --ff-only || echo "⚠ frontend não atualizado")
        exit 0
    volumes:
      - ..:/backend
      - ${FRONTEND_PATH}:/frontend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: greentech_db
      POSTGRES_USER: greentech
      POSTGRES_PASSWORD: greentech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greentech -d greentech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ..
    restart: unless-stopped
    environment:
      SECRET_KEY: troque-esta-chave-em-producao
      POSTGRES_DB: greentech_db
      POSTGRES_USER: greentech
      POSTGRES_PASSWORD: greentech
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      atualizar-repos:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ..:/app

  frontend:
    build: ${FRONTEND_PATH}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_started
      atualizar-repos:
        condition: service_completed_successfully
    ports:
      - "5173:5173"
    volumes:
      - ${FRONTEND_PATH}:/app
      - /app/node_modules

volumes:
  pgdata: